<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Metallic Royal Gold Gradients -->
    <linearGradient id="goldRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe885" />
      <stop offset="25%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#fff5b8" />
      <stop offset="75%" stop-color="#aa8012" />
      <stop offset="100%" stop-color="#e6ca65" />
    </linearGradient>

    <linearGradient id="nibGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#ffeaa7" />
      <stop offset="60%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8c6d12" />
    </linearGradient>

    <radialGradient id="darkBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181d29" />
      <stop offset="80%" stop-color="#0a0c12" />
      <stop offset="100%" stop-color="#050609" />
    </radialGradient>

    <filter id="goldGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Obsidian Medallion -->
  <circle cx="60" cy="60" r="56" fill="url(#darkBgGrad)" stroke="url(#goldRingGrad)" stroke-width="2.5" />
  
  <!-- Outer Dotted Filigree Ring -->
  <circle cx="60" cy="60" r="51.5" fill="none" stroke="url(#goldRingGrad)" stroke-width="0.8" stroke-dasharray="2.5, 3" opacity="0.85" />
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#goldRingGrad)" stroke-width="0.6" opacity="0.5" />

  <!-- 4 Cardinal Ornamental Jewels -->
  <circle cx="60" cy="8.5" r="2" fill="#ffe885" />
  <circle cx="60" cy="111.5" r="2" fill="#ffe885" />
  <circle cx="8.5" cy="60" r="2" fill="#ffe885" />
  <circle cx="111.5" cy="60" r="2" fill="#ffe885" />

  <!-- Inner Radiant Glow Circle -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="rgba(212, 175, 55, 0.2)" stroke-width="1" />

  <!-- Central Poetic Emblem: Stylized Arabic Calligraphy & Fountain Pen Nib (ريشة ودواة الشاعر) -->
  <g filter="url(#goldGlowFilter)">
    <!-- Poetic Crescent Wing (قوس النون والإلهام الشعري) -->
    <path d="M 32,54 C 30,76 46,92 60,92 C 74,92 90,76 88,54 C 86,68 74,84 60,84 C 46,84 34,68 32,54 Z" 
          fill="url(#goldRingGrad)" />

    <!-- Open Parchment Pages at Base (كتاب وديوان مفتوح) -->
    <path d="M 60,83 C 53,78 43,77 35,80 C 42,75 51,75 60,79 C 69,75 78,75 85,80 C 77,77 67,78 60,83 Z"
          fill="url(#goldRingGrad)" opacity="0.9" />

    <!-- Master Golden Quill / Fountain Pen Nib (ريشة القوافي الذهبية) -->
    <path d="M 60,18 L 68,46 C 70,54 66,66 60,74 C 54,66 50,54 52,46 Z" 
          fill="url(#nibGoldGrad)" 
          stroke="url(#goldRingGrad)" 
          stroke-width="0.75" />

    <!-- Pen Nib Breathing Slit & Heart Hole (شق الريشة وقصبة الإبداع) -->
    <line x1="60" y1="20" x2="60" y2="47" stroke="#0a0c12" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="60" cy="49" r="2" fill="#0a0c12" />

    <!-- Calligraphic Nuqta (Diamond Jewel - نقطة نون وقافية ذو النون) -->
    <polygon points="60,30 63.5,33.5 60,37 56.5,33.5" fill="#ffffff" />
    
    <!-- Top Crown Star (نجمة الإبداع الملوكية) -->
    <polygon points="60,13 61.5,17 65.5,17 62.5,19.5 63.5,23.5 60,21 56.5,23.5 57.5,19.5 54.5,17 58.5,17" fill="#ffeaa7" />
  </g>

  <!-- Subtle Accent Flank Leaves (غصني الزيتون والغار للأصالة السودانية) -->
  <g fill="url(#goldRingGrad)" opacity="0.8">
    <path d="M 28,66 C 24,62 23,55 26,50 C 27,56 30,62 33,65 Z" />
    <path d="M 25,76 C 20,72 20,65 24,60 C 24,66 27,72 31,75 Z" />
    
    <path d="M 92,66 C 96,62 97,55 94,50 C 93,56 90,62 87,65 Z" />
    <path d="M 95,76 C 100,72 100,65 96,60 C 96,66 93,72 89,75 Z" />
  </g>
</svg>

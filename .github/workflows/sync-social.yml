name: Dynamic Social Feed Sync (Facebook & TikTok)

on:
  schedule:
    # يعمل تلقائياً وبشكل دوري كل 30 دقيقة لجلب أحدث المنشورات ومقاطع تيك توك والإعجابات الحية أولاً بأول
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: 'المنصة (facebook أو tiktok)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - facebook
          - tiktok
      post_content:
        description: 'نص المنشور أو عنوان القصيدة'
        required: false
        type: string
      post_url:
        description: 'رابط المنشور على فيسبوك أو تيك توك'
        required: false
        type: string
  repository_dispatch:
    # استقبال فوري من خلال Webhook (مثل Zapier أو Make أو IFTTT) بمجرد النشر
    types: [new_social_post, sync_feed]

permissions:
  contents: write

concurrency:
  group: "social-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run Automated TikTok & Facebook Scraper
        run: |
          python scripts/sync_feed.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Webhook & Event Dispatch Processor
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          INPUT_PLATFORM: ${{ github.event.inputs.platform }}
          INPUT_CONTENT: ${{ github.event.inputs.post_content }}
          INPUT_URL: ${{ github.event.inputs.post_url }}
        run: |
          if [ -n "$INPUT_PLATFORM" ] && [ "$INPUT_PLATFORM" != "all" ]; then
            node scripts/sync-social.js "{\"platform\":\"$INPUT_PLATFORM\",\"content\":\"$INPUT_CONTENT\",\"url\":\"$INPUT_URL\"}"
          elif [ -n "$CLIENT_PAYLOAD" ] && [ "$CLIENT_PAYLOAD" != "null" ]; then
            node scripts/sync-social.js
          else
            echo "لا توجد حمولة Webhook إضافية؛ تم إنهاء جلب المزامنة بنجاح."
          fi

      - name: Commit & Push Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Social Sync Bot]"
          git add assets/data/social_feed.json
          if git diff --staged --quiet; then
            echo "لا توجد تعديلات جديدة للرفع."
          else
            git commit -m "Auto-sync: update social feed (Facebook & TikTok) [skip ci]"
            git push origin main
            echo "تم رفع التحديثات الجديدة بنجاح إلى المستودع."
          fi
